plugins {
    id 'base'
}

tasks.register('build_v1_20_1_fabric', Exec) {
    workingDir file('versions/v1_20_1/fabric')
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'gradlew.bat', '--no-daemon', 'build'
    } else {
        commandLine './gradlew', '--no-daemon', 'build'
    }
    def resolvedJavaHome = providers.gradleProperty('java_21_home').orElse(providers.environmentVariable('JAVA21_HOME')).orElse(providers.environmentVariable('JAVA_HOME')).orNull
    if (resolvedJavaHome != null && !resolvedJavaHome.toString().trim().isEmpty()) {
        environment 'JAVA_HOME', resolvedJavaHome
        if (!System.getProperty('os.name').toLowerCase().contains('windows')) {
            environment 'PATH', "${resolvedJavaHome}/bin:${System.getenv('PATH')}"
        }
    }
}

