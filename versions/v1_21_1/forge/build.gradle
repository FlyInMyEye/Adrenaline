plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

ext.minecraftVersion = '1.21.1'
ext.loaderId = 'forge'

apply from: '../../../gradle/mod-common.gradle'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def minecraft_version = '1.21.1'
def minecraft_version_range = '[1.21.1,1.22)'
def forge_version = '52.1.0'
def forge_version_range = '[52,)'
def loader_version_range = '[52,)'
def mapping_channel = 'official'
def mapping_version = '1.21.1'

sourceSets.main.resources.srcDir('../../../assets')
sourceSets.main.resources.srcDir('../common/src/main/resources')
sourceSets.main.resources.srcDir('src/generated/resources')
sourceSets.main.output.resourcesDir = sourceSets.main.java.destinationDirectory.get().asFile

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "adrenaline" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', 'adrenaline'
        }

        server {
            property 'forge.enabledGameTestNamespaces', 'adrenaline'
            args '--nogui'
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.4'))
    implementation(jarJar('io.github.llamalad7:mixinextras-forge:0.5.4')) {
        jarJar.ranged(it, '[0.5.4,)')
    }
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf('maven.modrinth:flys-config-lib:wO2v4USw')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    manifest {
        attributes(
            'Specification-Title': 'Adrenaline',
            'Specification-Vendor': 'Fly',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Fly',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs': 'adrenaline.mixins.json,adrenaline.forge.mixins.json'
        )
    }
}
def reobfJarTask = tasks.findByName('reobfJar')
if (reobfJarTask != null) {
    jar.finalizedBy(reobfJarTask)
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = modProperties + [
        minecraft_version: '1.21.1',
        minecraft_version_range: '[1.21.1,1.22)',
        forge_version: '52.1.0',
        forge_version_range: '[52,)',
        loader_version_range: '[52,)'
    ]
    inputs.property('mixinRefmap', "${modId}.refmap.json")
    doLast {
        def configFile = new File(destinationDir, "${modId}.mixins.json")
        def config = new groovy.json.JsonSlurper().parse(configFile)
        config.refmap = "${modId}.refmap.json".toString()
        configFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config)) + '\n'
    }
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'mcmod.info', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

mixin {
    add sourceSets.main, "${modId}.refmap.json"
    config "${modId}.mixins.json"
    config "${modId}.forge.mixins.json"
}

tasks.named('jar', Jar).configure {
    archiveFileName.set("${modId}-${loaderId}-${minecraftVersion}-${modVersion}-slim.jar")
}

tasks.named('jarJar', Jar).configure {
    archiveClassifier.set('')
    archiveFileName.set("${modId}-${loaderId}-${minecraftVersion}-${modVersion}.jar")
    destinationDirectory.set(layout.buildDirectory.dir('libs'))
}

reobf {
    jarJar {}
}

tasks.named('jarJar') {
    finalizedBy 'reobfJarJar'
}
