plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.113'
}

def workspaceProperties = new Properties()
def workspaceGradleProperties = file('../../../gradle.properties')
if (workspaceGradleProperties.exists()) {
    workspaceGradleProperties.withInputStream { input -> workspaceProperties.load(input) }
}
def sharedProperty = { key, fallback = null ->
    def value = workspaceProperties.getProperty(key)
    if (value != null) {
        return value
    }
    value = findProperty(key)
    if (value != null) {
        return value.toString()
    }
    fallback
}
def projectModId = sharedProperty('mod_id')
def projectModName = sharedProperty('mod_name')
def projectModGroupId = sharedProperty('mod_group_id')
def projectModVersion = sharedProperty('mod_version')
def projectModAuthors = sharedProperty('mod_authors')
def projectModLicense = sharedProperty('mod_license')
def projectModDescription = sharedProperty('mod_description')
def projectPublishModrinth = sharedProperty('publish_modrinth', 'false').toString()
def projectPublishCurseforge = sharedProperty('publish_curseforge', 'false').toString()
def projectPublishChangelog = sharedProperty('publish_changelog', '')
def projectPublishReleaseType = sharedProperty('publish_release_type', 'release')

version = projectModVersion
group = projectModGroupId

base {
    archivesName = 'adrenaline-neoforge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def neo_version = '21.1.224'

sourceSets.main.java.srcDir('../../../common/src/main/java')
sourceSets.main.java.srcDir('../common/src/main/java')
sourceSets.main.resources.srcDir('../../../assets')
sourceSets.main.resources.srcDir('../common/src/main/resources')
sourceSets.main.resources.srcDir('src/generated/resources')

tasks.named('processResources') {
    from('../../../native/build') {
        into 'adrenaline/natives'
        include '**/*.so', '**/*.dll', '**/*.dylib'
    }
}

neoForge {
    version = neo_version
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'adrenaline'
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'adrenaline'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        "adrenaline" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
jar {
    def effectiveVersion = projectModVersion.toString()
    def versionedName = "adrenaline-neoforge-1.21.1-${effectiveVersion}.jar"
    if (delegate.hasProperty('archiveFileName')) {
        archiveFileName.set(versionedName)
    } else {
        archiveName = versionedName
    }
}
