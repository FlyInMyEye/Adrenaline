plugins {
    id 'fabric-loom' version '1.16.1'
    id 'maven-publish'
}

ext.minecraftVersion = '1.21.1'
ext.loaderId = 'fabric'
ext.javaRelease = 21

apply from: '../../../gradle/mod-common.gradle'

sourceSets.main.resources.srcDir('../../../assets')
sourceSets.main.resources.srcDir('../common/src/main/resources')

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.18.6"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.116.10+1.21.1"
}

apply from: '../../../gradle/fabric.gradle'
