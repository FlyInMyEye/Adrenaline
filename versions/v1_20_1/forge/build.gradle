plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

ext.minecraftVersion = '1.20.1'
ext.loaderId = 'forge'

apply from: '../../../gradle/mod-common.gradle'

def minecraftVersionRange = '[1.20.1,1.21)'
def forgeVersion = '47.4.10'
def forgeVersionRange = '[47,)'
def loaderVersionRange = '[47,)'
def generatedForgeMixinsDir = layout.buildDirectory.dir('generated/resources/forgeMixins')

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets.main.resources.setSrcDirs(['../../../assets', 'src/main/resources', 'src/generated/resources'])

minecraft {
    mappings channel: 'official', version: minecraftVersion
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${modId}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', modId
        }

        server {
            property 'forge.enabledGameTestNamespaces', modId
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', modId
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', modId, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

repositories {
    maven {
        url 'https://api.modrinth.com/maven'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraftVersion}-${forgeVersion}"
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.4'))
    implementation(jarJar('io.github.llamalad7:mixinextras-forge:0.5.4')) {
        jarJar.ranged(it, '[0.5.4,)')
    }
    implementation fg.deobf('maven.modrinth:flys-config-lib:aRuhlvi5')
    compileOnly fg.deobf('maven.modrinth:blueprint:xtEwbO0X')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

def generateForgeMixinConfigs = tasks.register('generateForgeMixinConfigs') {
    def sharedMixinConfigs = files(
        "../common/src/main/resources/${modId}.mixins.json",
        "../common/src/main/resources/${modId}.levelgen.mixins.json"
    )
    inputs.files(sharedMixinConfigs)
    inputs.property('refmap', "${modId}.refmap.json")
    outputs.dir(generatedForgeMixinsDir)
    doLast {
        File outputDirectory = generatedForgeMixinsDir.get().asFile
        delete(outputDirectory)
        outputDirectory.mkdirs()
        sharedMixinConfigs.each { inputFile ->
            def config = new groovy.json.JsonSlurper().parse(inputFile)
            config.refmap = "${modId}.refmap.json".toString()
            if (inputFile.name == "${modId}.mixins.json") {
                config.client.removeAll(['MixinGui', 'MixinDebugScreenOverlay'])
                config.client.addAll(['MixinForgeLoadingOverlay'])
            }
            new File(outputDirectory, inputFile.name).text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config)) + '\n'
        }
    }
}

sourceSets.main.resources.srcDir(generateForgeMixinConfigs)

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = modProperties + [
        minecraft_version: minecraftVersion,
        minecraft_version_range: minecraftVersionRange,
        forge_version: forgeVersion,
        forge_version_range: forgeVersionRange,
        loader_version_range: loaderVersionRange
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    if (prodBuild.get()) {
        archiveFileName.set("adrenaline-forge-1.20.1-${modVersion}-prod-slim.jar")
        exclude('net/fly/adrenaline/client/WorldgenStatsOverlay.class')
    } else {
        archiveFileName.set("adrenaline-forge-1.20.1-${modVersion}-slim.jar")
    }

    manifest {
        attributes([
            'Specification-Title': modId,
            'Specification-Vendor': modAuthors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': modAuthors,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs': "${modId}.mixins.json,${modId}.compat.mixins.json,${modId}.levelgen.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.named('jarJar', Jar).configure {
    if (prodBuild.get()) {
        archiveFileName.set("adrenaline-forge-1.20.1-${modVersion}-prod.jar")
        exclude('net/fly/adrenaline/client/WorldgenStatsOverlay.class')
    } else {
        archiveFileName.set("adrenaline-forge-1.20.1-${modVersion}.jar")
    }
}

mixin {
    add sourceSets.main, "${modId}.refmap.json"
    config "${modId}.mixins.json"
    config "${modId}.compat.mixins.json"
    config "${modId}.levelgen.mixins.json"
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.register('buildProd', GradleBuild) {
    tasks = ['build']
    startParameter.projectProperties = new LinkedHashMap(gradle.startParameter.projectProperties) + [prodBuild: 'true']
}
