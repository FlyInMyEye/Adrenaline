plugins {
    id 'fabric-loom' version '1.16.1'
    id 'maven-publish'
}

def workspaceProperties = new Properties()
def workspaceGradleProperties = file('../../../gradle.properties')
if (workspaceGradleProperties.exists()) {
    workspaceGradleProperties.withInputStream { input -> workspaceProperties.load(input) }
}
def sharedProperty = { key, fallback = null ->
    def value = workspaceProperties.getProperty(key)
    if (value != null) {
        return value
    }
    value = findProperty(key)
    if (value != null) {
        return value.toString()
    }
    fallback
}
def projectModId = sharedProperty('mod_id')
def projectModName = sharedProperty('mod_name')
def projectModGroupId = sharedProperty('mod_group_id')
def projectModVersion = sharedProperty('mod_version')
def projectModAuthors = sharedProperty('mod_authors')
def projectModLicense = sharedProperty('mod_license')
def projectModDescription = sharedProperty('mod_description')
def projectPublishModrinth = sharedProperty('publish_modrinth', 'false').toString()
def projectPublishCurseforge = sharedProperty('publish_curseforge', 'false').toString()
def projectPublishChangelog = sharedProperty('publish_changelog', '')
def projectPublishReleaseType = sharedProperty('publish_release_type', 'release')
def prodBuild = providers.gradleProperty('prodBuild').map { it.toBoolean() }.orElse(false)
def generatedBuildConfigDir = layout.buildDirectory.dir('generated/sources/buildConfig/java')

version = projectModVersion
group = projectModGroupId

base {
    archivesName = 'adrenaline-fabric'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

sourceSets.main.java.srcDir('../../../common/src/main/java')
sourceSets.main.java.srcDir('../common/src/main/java')
sourceSets.main.java.srcDir(generatedBuildConfigDir)
sourceSets.main.resources.srcDir('../../../assets')
sourceSets.main.resources.srcDir('../common/src/main/resources')

tasks.named('processResources') {
    from('../../../native/build') {
        into 'adrenaline/natives'
        include '**/*.so', '**/*.dll', '**/*.dylib'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.19.1"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.7+1.20.1"
    modImplementation 'maven.modrinth:flys-config-lib:vabRUNCH'
    modCompileOnly 'com.terraformersmc:modmenu:7.2.2'
    include modImplementation('io.github.llamalad7:mixinextras-fabric:0.5.4')
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

loom {
    mixin {
        defaultRefmapName.set("${project.findProperty('mod_id') ?: 'mod'}.refmap.json")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.register('generateBuildConfig') {
    inputs.property('prodBuild', prodBuild)
    outputs.dir(generatedBuildConfigDir)
    doLast {
        File outputFile = generatedBuildConfigDir.get().file('net/fly/adrenaline/BuildConfig.java').asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = """package net.fly.adrenaline;

public final class BuildConfig {
    public static final boolean DEBUG = ${!prodBuild.get()};

    private BuildConfig() {
    }
}
"""
    }
}

tasks.named('compileJava', JavaCompile).configure {
    dependsOn tasks.named('generateBuildConfig')
}

tasks.named('sourcesJar', Jar).configure {
    dependsOn tasks.named('generateBuildConfig')
}
jar {
    def effectiveVersion = projectModVersion.toString()
    def versionedName = "adrenaline-fabric-1.20.1-${effectiveVersion}.jar"
    if (delegate.hasProperty('archiveFileName')) {
        archiveFileName.set(versionedName)
    } else {
        archiveName = versionedName
    }
}

tasks.named('remapJar') {
    archiveFileName.set("adrenaline-fabric-1.20.1-${projectModVersion}.jar")
}

tasks.named('remapSourcesJar') {
    archiveFileName.set("adrenaline-fabric-1.20.1-${projectModVersion}-sources.jar")
}
