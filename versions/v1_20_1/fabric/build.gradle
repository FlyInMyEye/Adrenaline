plugins {
    id 'fabric-loom' version '1.16.1'
    id 'maven-publish'
}

ext.minecraftVersion = '1.20.1'
ext.loaderId = 'fabric'
ext.javaRelease = 17

apply from: '../../../gradle/mod-common.gradle'

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

sourceSets.main.resources.srcDir('../../../assets')
sourceSets.main.resources.srcDir('../common/src/main/resources')

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.19.1"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.7+1.20.1"
    modImplementation 'maven.modrinth:flys-config-lib:vabRUNCH'
    modCompileOnly 'com.terraformersmc:modmenu:7.2.2'
    include modImplementation('io.github.llamalad7:mixinextras-fabric:0.5.4')
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

apply from: '../../../gradle/fabric.gradle'
